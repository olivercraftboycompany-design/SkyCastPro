<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-white overflow-x-hidden pb-16">

<div id="app"></div>

<script>
/* ============================== CONSTANTS ============================== */

const WEATHER_DESC = {
  0:"Clear sky",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",
  45:"Fog",48:"Depositing rime fog",
  51:"Light drizzle",53:"Moderate drizzle",55:"Dense drizzle",
  56:"Light freezing drizzle",57:"Dense freezing drizzle",
  61:"Slight rain",63:"Moderate rain",65:"Heavy rain",
  66:"Light freezing rain",67:"Heavy freezing rain",
  71:"Slight snow",73:"Moderate snow",75:"Heavy snow",77:"Snow grains",
  80:"Slight rain showers",81:"Moderate rain showers",82:"Violent rain showers",
  85:"Slight snow showers",86:"Heavy snow showers",
  95:"Thunderstorm",96:"Thunderstorm with light hail",99:"Thunderstorm with heavy hail",
};

const ICON_MAP = (code, isDay) => {
  if (code === 0) return isDay ? ["sun","text-amber-400"] : ["moon","text-slate-300"];
  if ([1,2,3].includes(code)) return isDay ? ["cloud-sun","text-slate-300"] : ["cloud-moon","text-slate-300"];
  if (code>=45 && code<=48) return ["cloud-fog","text-slate-400"];
  if (code>=51 && code<=57) return ["cloud-drizzle","text-cyan-300"];
  if (code>=61 && code<=67) return ["cloud-rain","text-blue-400"];
  if (code>=71 && code<=77) return ["cloud-snow","text-indigo-200"];
  if (code>=80 && code<=82) return ["cloud-rain-wind","text-blue-500"];
  if (code>=85 && code<=86) return ["cloud-snow","text-indigo-200"];
  if (code>=95 && code<=99) return ["cloud-lightning","text-amber-500"];
  return ["cloud","text-slate-300"];
};

const WIND_DIRS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const windDir = deg => WIND_DIRS[Math.round(deg/22.5) % 16];

const uvSeverity = uv => uv<=2?"Low":uv<=5?"Moderate":uv<=7?"High":uv<=10?"Very High":"Extreme";
const uvColor = uv => uv<=2?"text-green-400":uv<=5?"text-yellow-400":uv<=7?"text-orange-400":uv<=10?"text-red-400":"text-purple-400";

const aqiSeverity = aqi => {
  if (aqi==null) return {label:"—",color:"text-slate-400"};
  if (aqi<=50) return {label:"Good",color:"text-green-400"};
  if (aqi<=100) return {label:"Moderate",color:"text-yellow-400"};
  if (aqi<=150) return {label:"Unhealthy (Sensitive)",color:"text-orange-400"};
  if (aqi<=200) return {label:"Unhealthy",color:"text-red-400"};
  if (aqi<=300) return {label:"Very Unhealthy",color:"text-purple-400"};
  return {label:"Hazardous",color:"text-rose-600"};
};

const SEVERITY_STYLE = {
  Extreme: {ring:"border-red-500/50", bg:"bg-red-500/10", text:"text-red-400", chip:"bg-red-500/20 text-red-300", dot:"bg-red-500"},
  Severe:  {ring:"border-orange-500/50", bg:"bg-orange-500/10", text:"text-orange-400", chip:"bg-orange-500/20 text-orange-300", dot:"bg-orange-500"},
  Moderate:{ring:"border-amber-400/50", bg:"bg-amber-400/10", text:"text-amber-300", chip:"bg-amber-400/20 text-amber-200", dot:"bg-amber-400"},
  Minor:   {ring:"border-blue-400/50", bg:"bg-blue-400/10", text:"text-blue-300", chip:"bg-blue-400/20 text-blue-200", dot:"bg-blue-400"},
  Unknown: {ring:"border-slate-400/40", bg:"bg-slate-400/10", text:"text-slate-300", chip:"bg-slate-400/20 text-slate-200", dot:"bg-slate-400"},
};
const sevStyle = s => SEVERITY_STYLE[s] || SEVERITY_STYLE.Unknown;

function moonPhase(date) {
  // Days since known new moon (2000-01-06 18:14 UTC), synodic month 29.53058867
  const synodic = 29.53058867;
  const known = Date.UTC(2000,0,6,18,14,0);
  const diffDays = (date.getTime() - known) / 86400000;
  let phase = (diffDays % synodic) / synodic;
  if (phase < 0) phase += 1;
  const illumination = Math.round((1 - Math.cos(2*Math.PI*phase)) / 2 * 100);
  const names = ["New Moon","Waxing Crescent","First Quarter","Waxing Gibbous","Full Moon","Waning Gibbous","Last Quarter","Waning Crescent"];
  const idx = Math.round(phase * 8) % 8;
  const icons = ["moon","moon","moon","moon","moon","moon","moon","moon"];
  return { name: names[idx], illumination, phase };
}

function sunArcProgress(now, sunriseIso, sunsetIso) {
  // Returns { frac, isDay, phaseLabel } where frac is 0..1 across the visible day/night arc
  const sunrise = new Date(sunriseIso).getTime();
  const sunset = new Date(sunsetIso).getTime();
  const t = now.getTime();
  if (t >= sunrise && t <= sunset) {
    const frac = (t - sunrise) / (sunset - sunrise);
    let phaseLabel = 'Daytime';
    if (frac < 0.08) phaseLabel = 'Sunrise';
    else if (frac > 0.92) phaseLabel = 'Sunset approaching';
    else if (frac < 0.35) phaseLabel = 'Morning';
    else if (frac < 0.65) phaseLabel = 'Midday';
    else phaseLabel = 'Afternoon';
    return { frac, isDay:true, phaseLabel };
  }
  // Nighttime: map remaining night hours across a 0..1 arc for a moon path
  let nightStart, nightEnd;
  if (t > sunset) { nightStart = sunset; nightEnd = sunrise + 86400000; }
  else { nightStart = sunset - 86400000; nightEnd = sunrise; }
  const frac = (t - nightStart) / (nightEnd - nightStart);
  return { frac: Math.min(1, Math.max(0, frac)), isDay:false, phaseLabel: 'Nighttime' };
}

function fmtTime(iso, opts) {
  try { return new Date(iso).toLocaleTimeString([], opts || {hour:'2-digit', minute:'2-digit'}); }
  catch(e){ return "—"; }
}
function fmtDateTime(iso) {
  try { return new Date(iso).toLocaleString([], {weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}); }
  catch(e){ return "Unknown"; }
}
function todayDailyIdx(daily) {
  if (!daily || !daily.time) return 0;
  const todayStr = new Date().toDateString();
  const idx = daily.time.findIndex(t => new Date(t).toDateString() === todayStr);
  return idx >= 0 ? idx : 0;
}

/* ============================== STATE ============================== */

const state = {
  location: { name:'New York, NY', lat:40.7128, lon:-74.0060 },
  unit: 'F',
  weather: null,
  aqi: null,
  marine: null,
  alerts: [],
  forecastNarrative: null,
  isUSLocation: null, // null=unknown yet, true/false after NWS lookup attempt
  loading: true,
  isLocating: false,
  view: 'dashboard', // 'dashboard' | 'warnings'
  expandedAlert: null,
  expandedHour: null,
  expandedDay: null,
  searchQuery: '',
  searchResults: [],
  showDropdown: false,
  searchTimer: null,
  mapKeyRendered: null,
  nationalAlerts: [],
  nationalAlertsLoading: false,
  nationalAlertsError: false,
};

let leafletMap = null;
let precipLayerGroup = null;
let alertLayerGroup = null;

/* ============================== DATA FETCHING ============================== */

async function fetchAllData() {
  state.loading = true;
  render();
  const { lat, lon } = state.location;
  const tempUnit = state.unit === 'F' ? 'fahrenheit' : 'celsius';
  const windUnit = state.unit === 'F' ? 'mph' : 'kmh';

  const currentParams = [
    'temperature_2m','relative_humidity_2m','apparent_temperature','is_day','precipitation',
    'weather_code','cloud_cover','cloud_cover_low','cloud_cover_mid','cloud_cover_high',
    'wind_speed_10m','wind_direction_10m','wind_gusts_10m','surface_pressure','pressure_msl',
    'visibility','soil_temperature_0cm','soil_temperature_6cm','soil_temperature_18cm','soil_temperature_54cm',
    'soil_moisture_0_to_7cm','soil_moisture_7_to_28cm','soil_moisture_28_to_100cm',
    'dew_point_2m','wet_bulb_temperature_2m','rain','showers','snowfall'
  ].join(',');

  const hourlyParams = [
    'temperature_2m','weather_code','precipitation_probability','evapotranspiration',
    'vapor_pressure_deficit','shortwave_radiation','direct_radiation','diffuse_radiation',
    'boundary_layer_height','cape','lifted_index','snow_depth','snowfall','rain',
    'freezing_level_height','wind_speed_80m','temperature_80m','visibility'
  ].join(',');

  const dailyParams = [
    'weather_code','temperature_2m_max','temperature_2m_min','sunrise','sunset',
    'uv_index_max','precipitation_probability_max','precipitation_sum',
    'rain_sum','snowfall_sum','precipitation_hours','shortwave_radiation_sum',
    'wind_speed_10m_max','wind_gusts_10m_max'
  ].join(',');

  // 1. Core forecast — Open-Meteo Forecast API
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=${currentParams}&hourly=${hourlyParams}&daily=${dailyParams}&past_days=7&forecast_days=8&timezone=auto&temperature_unit=${tempUnit}&wind_speed_unit=${windUnit}&precipitation_unit=inch`);
    state.weather = await res.json();
  } catch (e) { console.error("Forecast fetch failed", e); state.weather = null; }

  // 2. Air Quality API (gases + both AQI standards + pollen where available)
  try {
    const res = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,european_aqi,pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,sulphur_dioxide,ozone,dust,uv_index&hourly=alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen&timezone=auto`);
    if (res.ok) state.aqi = await res.json(); else state.aqi = null;
  } catch (e) { state.aqi = null; }

  // 3. Marine API — waves & swell (fails gracefully for inland locations)
  try {
    const res = await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&current=wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_period,sea_surface_temperature&timezone=auto`);
    if (res.ok) {
      const json = await res.json();
      const c = json.current || {};
      state.marine = (c.wave_height != null) ? json : null;
    } else state.marine = null;
  } catch (e) { state.marine = null; }

  // 4. NWS — points, active alerts, and narrative forecast (US locations only)
  try {
    const pointsRes = await fetch(`https://api.weather.gov/points/${lat},${lon}`, { headers: { 'Accept':'application/geo+json' } });
    if (pointsRes.ok) {
      const points = await pointsRes.json();
      state.isUSLocation = true;
      const zoneUrl = points.properties.forecastZone || points.properties.county;
      const zoneId = zoneUrl ? zoneUrl.split('/').pop() : null;

      if (zoneId) {
        try {
          const alertsRes = await fetch(`https://api.weather.gov/alerts/active?zone=${zoneId}`);
          if (alertsRes.ok) {
            const alertsJson = await alertsRes.json();
            state.alerts = (alertsJson.features || []).map(f => f.properties);
          } else state.alerts = [];
        } catch (e) { state.alerts = []; }
      } else state.alerts = [];

      try {
        if (points.properties.forecast) {
          const fRes = await fetch(points.properties.forecast);
          if (fRes.ok) {
            const fJson = await fRes.json();
            state.forecastNarrative = (fJson.properties && fJson.properties.periods) ? fJson.properties.periods.slice(0,4) : null;
          }
        }
      } catch (e) { state.forecastNarrative = null; }

    } else {
      state.isUSLocation = false;
      state.alerts = [];
      state.forecastNarrative = null;
    }
  } catch (e) {
    state.isUSLocation = false;
    state.alerts = [];
    state.forecastNarrative = null;
  }

  state.loading = false;
  render();
}

/* ============================== NATIONAL STORM TRACKER ============================== */

const STORM_EVENT_STYLE = {
  'Tornado Warning':          { color:'#ef4444', priority:5 },
  'Tornado Watch':            { color:'#fb923c', priority:4 },
  'Severe Thunderstorm Warning': { color:'#f59e0b', priority:3 },
  'Severe Thunderstorm Watch':   { color:'#facc15', priority:2 },
  'Flash Flood Warning':      { color:'#22d3ee', priority:2 },
  'Hurricane Warning':        { color:'#d946ef', priority:5 },
  'Hurricane Watch':          { color:'#c084fc', priority:4 },
};
function stormStyle(event) {
  return STORM_EVENT_STYLE[event] || { color:'#94a3b8', priority:1 };
}

async function fetchNationalStormAlerts() {
  state.nationalAlertsLoading = true;
  state.nationalAlertsError = false;
  render();
  try {
    const eventTypes = ['Tornado Warning','Tornado Watch','Severe Thunderstorm Warning','Severe Thunderstorm Watch','Flash Flood Warning','Hurricane Warning','Hurricane Watch'];
    const res = await fetch(`https://api.weather.gov/alerts/active?status=actual&message_type=alert,update`);
    if (!res.ok) throw new Error('bad response');
    const json = await res.json();
    const features = json.features || [];
    const filtered = features.filter(f => eventTypes.includes(f.properties.event));
    state.nationalAlerts = filtered.map(f => ({
      ...f.properties,
      id: f.id || f.properties.id,
      geometry: f.geometry,
    })).sort((a,b) => stormStyle(b.event).priority - stormStyle(a.event).priority);
  } catch (e) {
    console.error('National storm alert fetch failed', e);
    state.nationalAlerts = [];
    state.nationalAlertsError = true;
  }
  state.nationalAlertsLoading = false;
  render();
}

/* ============================== SMART ALERTS ENGINE ============================== */

function generateSmartAlerts() {
  if (!state.weather) return [];
  const { current, daily, hourly } = state.weather;
  const unit = state.unit;
  const tips = [];
  const hrIdx = Math.max(0, hourly.time.findIndex(t => new Date(t) > new Date()));
  const tIdx = todayDailyIdx(daily);

  const uv = daily.uv_index_max ? daily.uv_index_max[tIdx] : 0;
  if (uv >= 8) tips.push({ icon:'sun', level:'warn', text:`Extreme UV today (index ${Math.round(uv)}). Wear SPF 30+, sunglasses, and limit midday sun exposure.` });
  else if (uv >= 6) tips.push({ icon:'sun', level:'info', text:`High UV today (index ${Math.round(uv)}). Sunscreen recommended if you're outside for long.` });

  const feels = current.apparent_temperature;
  const heatThresh = unit==='F' ? 100 : 38;
  const coldThresh = unit==='F' ? 15 : -9;
  if (feels >= heatThresh) tips.push({ icon:'thermometer-sun', level:'warn', text:`Dangerous heat — feels like ${Math.round(feels)}°${unit}. Stay hydrated and limit strenuous outdoor activity.` });
  if (feels <= coldThresh) tips.push({ icon:'thermometer-snowflake', level:'warn', text:`Dangerous cold — feels like ${Math.round(feels)}°${unit}. Bundle up and limit skin exposure.` });

  const gust = current.wind_gusts_10m || 0;
  const gustThresh = unit==='F' ? 40 : 64;
  if (gust >= gustThresh) tips.push({ icon:'wind', level:'warn', text:`Strong wind gusts up to ${Math.round(gust)} ${unit==='F'?'mph':'km/h'} — secure loose outdoor objects.` });

  const freezeLevel = hourly.freezing_level_height ? hourly.freezing_level_height[hrIdx] : null;
  const precipNext = hourly.precipitation_probability ? hourly.precipitation_probability[hrIdx] : 0;
  if (current.temperature_2m <= (unit==='F'?34:1) && precipNext >= 40) {
    tips.push({ icon:'cloud-snow', level:'warn', text:`Near-freezing temps with precipitation likely — watch for icy roads and sidewalks.` });
  }

  const cape = hourly.cape ? hourly.cape[hrIdx] : 0;
  if (cape >= 2500) tips.push({ icon:'zap', level:'warn', text:`High CAPE (${Math.round(cape)} J/kg) signals strong thunderstorm potential this afternoon.` });

  const rainSum = daily.precipitation_sum ? daily.precipitation_sum[tIdx] : 0;
  if (rainSum >= (unit==='F'?1.5:38/25.4)) tips.push({ icon:'cloud-rain-wind', level:'info', text:`Heavy rain expected today (${rainSum.toFixed(2)} in) — allow extra travel time.` });

  const aqi = state.aqi && state.aqi.current ? state.aqi.current.us_aqi : null;
  if (aqi != null && aqi > 100) tips.push({ icon:'activity', level: aqi>150?'warn':'info', text:`Air quality is ${aqiSeverity(aqi).label.toLowerCase()} (AQI ${aqi}). Sensitive groups should limit outdoor exertion.` });

  const vis = current.visibility;
  const visThreshM = unit==='F' ? 1609.34 : 1000;
  if (vis != null && vis < visThreshM) tips.push({ icon:'cloud-fog', level:'info', text:`Low visibility conditions — drive with headlights on and extra following distance.` });

  if (tips.length === 0) tips.push({ icon:'check-circle', level:'good', text:'Conditions look normal — no elevated weather risks detected right now.' });

  return tips;
}

async function handleGeolocation() {
  if (!navigator.geolocation) return;
  state.isLocating = true; render();
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const { latitude, longitude } = pos.coords;
    try {
      const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
      const data = await res.json();
      state.location = { name: data.city || data.locality || 'Current Location', lat: latitude, lon: longitude };
    } catch (e) {
      state.location = { name: 'Current Location', lat: latitude, lon: longitude };
    }
    state.isLocating = false;
    await fetchAllData();
  }, () => {
    state.isLocating = false; render();
    alert("Unable to retrieve your location. Please check browser permissions.");
  });
}

function onSearchInput(val) {
  state.searchQuery = val;
  clearTimeout(state.searchTimer);
  if (val.length > 2) {
    state.searchTimer = setTimeout(async () => {
      try {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(val)}&count=6&language=en&format=json`);
        const data = await res.json();
        state.searchResults = data.results || [];
        state.showDropdown = true;
      } catch (e) { state.searchResults = []; }
      render();
    }, 400);
  } else {
    state.searchResults = [];
    state.showDropdown = false;
    render();
  }
}

function selectLocation(idx) {
  const loc = state.searchResults[idx];
  if (!loc) return;
  state.location = {
    name: `${loc.name}${loc.admin1 ? ', '+loc.admin1 : ''}${loc.country_code ? ', '+loc.country_code : ''}`,
    lat: loc.latitude, lon: loc.longitude
  };
  state.searchQuery = ''; state.searchResults = []; state.showDropdown = false;
  fetchAllData();
}

function toggleUnit() {
  state.unit = state.unit === 'F' ? 'C' : 'F';
  fetchAllData();
}

function setView(v) { state.view = v; state.expandedAlert = null; render(); }
function toggleAlert(idx) { state.expandedAlert = state.expandedAlert === idx ? null : idx; render(); }
function toggleHour(idx) { state.expandedHour = state.expandedHour === idx ? null : idx; state.expandedDay = null; render(); }
function toggleDay(idx) { state.expandedDay = state.expandedDay === idx ? null : idx; state.expandedHour = null; render(); }

/* ============================== RENDER: NAV ============================== */

function renderNav() {
  const alertCount = state.alerts.length;
  const worst = state.alerts.reduce((acc, a) => {
    const order = {Extreme:4, Severe:3, Moderate:2, Minor:1, Unknown:0};
    return (order[a.severity]||0) > (order[acc]||0) ? a.severity : acc;
  }, 'Unknown');
  const badgeStyle = alertCount > 0 ? sevStyle(worst) : null;

  return `
  <nav class="sticky top-0 z-50 bg-slate-950/60 backdrop-blur-2xl border-b border-white/10 px-4 py-4 md:px-8">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
        <div class="flex items-center gap-3">
          <div class="bg-white p-1.5 rounded-xl shadow-lg shadow-black/20">
            <svg viewBox="0 0 100 100" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
              <g stroke="#f6b93b" stroke-width="6" stroke-linecap="round">
                <line x1="46" y1="4" x2="44" y2="18"/>
                <line x1="66" y1="10" x2="58" y2="22"/>
                <line x1="24" y1="12" x2="33" y2="23"/>
                <line x1="12" y1="34" x2="26" y2="33"/>
              </g>
              <circle cx="47" cy="38" r="19" fill="#f6b93b"/>
              <ellipse cx="63" cy="56" rx="22" ry="16" fill="#a8d8ea"/>
              <ellipse cx="38" cy="59" rx="24" ry="17" fill="#a8d8ea"/>
              <ellipse cx="53" cy="63" rx="19" ry="13" fill="#5fa8be"/>
              <rect x="16" y="61" width="66" height="15" rx="7.5" fill="#5fa8be"/>

function escapeHtml(str) { return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(str) { return escapeHtml(str); }

            <span class="text-xs font-mono font-semibold px-2 py-0.5 rounded ${style.chip}">${escapeHtml(a.severity || 'Unknown')}</span>

function miniDial(value, min, max, color, sizePx) {
  const cx=26, cy=26, r=20, startAngle=-125, endAngle=125;
  const v = Math.min(max, Math.max(min, value));
  const frac = max===min ? 0 : (v-min)/(max-min);
  const angle = startAngle + frac*(endAngle-startAngle);
  const p1 = polar(cx,cy,r,startAngle), p2 = polar(cx,cy,r,endAngle);
  const tip = polar(cx,cy,r-5,angle), tail = polar(cx,cy,7,angle+180);
  const sideA = polar(cx,cy,2.5,angle+90), sideB = polar(cx,cy,2.5,angle-90);
  const arcP = polar(cx,cy,r,startAngle+frac*(endAngle-startAngle));
  const largeArc = (frac*(endAngle-startAngle)) > 180 ? 1 : 0;
  const s = sizePx || 52;
  return `
  <svg viewBox="0 0 52 52" style="width:${s}px;height:${s}px" class="flex-shrink-0">
    <circle cx="${cx}" cy="${cy}" r="${r+3}" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <path d="M ${p1.x} ${p1.y} A ${r} ${r} 0 1 1 ${p2.x} ${p2.y}" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-linecap="round" />
    <path d="M ${p1.x} ${p1.y} A ${r} ${r} 0 ${largeArc} 1 ${arcP.x} ${arcP.y}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <polygon points="${tip.x},${tip.y} ${sideA.x},${sideA.y} ${tail.x},${tail.y} ${sideB.x},${sideB.y}" fill="${color}" class="instrument-needle" />
    <circle cx="${cx}" cy="${cy}" r="2.5" fill="#0b1220" stroke="${color}" stroke-width="1" />
  </svg>`;
}

/* ============================== RENDER: ANALOG INSTRUMENTS ============================== */

function polar(cx, cy, r, deg) {
  const rad = (deg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function compassGauge(current) {
  const cx=100, cy=100, r=88;
  const dirDeg = current.wind_direction_10m || 0;
  const speed = Math.round(current.wind_speed_10m || 0);
  let ticks = '';
  for (let d=0; d<360; d+=10) {
    const major = d % 30 === 0;
    const p1 = polar(cx, cy, r-1, d);
    const p2 = polar(cx, cy, r-1-(major?12:6), d);
    ticks += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" class="${major?'instrument-tick-major':'instrument-tick-minor'}" />`;
  }
  const labels = [['N',0],['E',90],['S',180],['W',270]].map(([t,d]) => {
    const p = polar(cx, cy, r-26, d);
    return `<text x="${p.x}" y="${p.y+5}" text-anchor="middle" class="instrument-label font-bold" font-size="15" fill="${t==='N'?'#f87171':'#e2e8f0'}">${t}</text>`;
  }).join('');
  const needleLen = r - 22;
  const tip = polar(cx, cy, needleLen, dirDeg);
  const tail = polar(cx, cy, needleLen*0.35, dirDeg+180);
  const sideA = polar(cx, cy, 7, dirDeg+90);
  const sideB = polar(cx, cy, 7, dirDeg-90);

  return `
  <div class="glass rounded-2xl p-3 shadow-xl flex flex-col items-center">
    <div class="flex items-center gap-1.5 text-slate-400 mb-1 self-start"><i data-lucide="compass" style="width:13px;height:13px"></i><span class="text-xs font-medium whitespace-nowrap">Compass</span></div>
    <svg viewBox="0 0 200 200" class="w-full max-w-[110px]">
      <circle cx="${cx}" cy="${cy}" r="${r}" class="instrument-face" />
      <circle cx="${cx}" cy="${cy}" r="${r-16}" fill="none" stroke="rgba(255,255,255,0.06)" />
      ${ticks}
      ${labels}
      <polygon points="${tip.x},${tip.y} ${sideA.x},${sideA.y} ${tail.x},${tail.y} ${sideB.x},${sideB.y}"
        fill="#3b82f6" stroke="#93c5fd" stroke-width="1" class="instrument-needle" />
      <circle cx="${cx}" cy="${cy}" r="6" fill="#0b1220" stroke="#93c5fd" stroke-width="1.5" />
    </svg>
    <div class="text-center mt-0.5">
      <span class="text-lg font-bold font-mono">${speed}</span>
      <span class="text-xs text-slate-400 ml-1">${state.unit==='F'?'mph':'km/h'}</span>
      <p class="text-xs text-slate-400 font-mono">${windDir(dirDeg)} · ${Math.round(dirDeg)}°</p>
    </div>
  </div>`;
}

function barometerGauge(current) {
  const cx=100, cy=110, r=88;
  // Dial sweeps 950–1050 hPa across a 240° arc (-120° to +120° from top)
  const minP=950, maxP=1050, startAngle=-120, endAngle=120;
  const pressure = current.pressure_msl || current.surface_pressure || 1013;
  const clamped = Math.min(maxP, Math.max(minP, pressure));
  const frac = (clamped - minP) / (maxP - minP);
  const needleAngle = startAngle + frac * (endAngle - startAngle);

  let ticks = '';
  const zones = [
    {from:950, to:980, color:'#f87171'},   // low / stormy
    {from:980, to:1013, color:'#fbbf24'},  // change
    {from:1013, to:1030, color:'#34d399'}, // fair
    {from:1030, to:1050, color:'#60a5fa'}, // dry
  ];
  zones.forEach(z => {
    const a1 = startAngle + ((z.from-minP)/(maxP-minP))*(endAngle-startAngle);
    const a2 = startAngle + ((z.to-minP)/(maxP-minP))*(endAngle-startAngle);
    const p1 = polar(cx,cy,r-3,a1), p2 = polar(cx,cy,r-3,a2);
    const largeArc = (a2-a1) > 180 ? 1 : 0;
    ticks += `<path d="M ${p1.x} ${p1.y} A ${r-3} ${r-3} 0 ${largeArc} 1 ${p2.x} ${p2.y}" fill="none" stroke="${z.color}" stroke-width="5" stroke-linecap="round" opacity="0.55" />`;
  });
  for (let p=minP; p<=maxP; p+=10) {
    const a = startAngle + ((p-minP)/(maxP-minP))*(endAngle-startAngle);
    const t1 = polar(cx,cy,r-14,a), t2 = polar(cx,cy,r-24,a);
    ticks += `<line x1="${t1.x}" y1="${t1.y}" x2="${t2.x}" y2="${t2.y}" class="instrument-tick-major" />`;
    if (p % 20 === 0) {
      const lp = polar(cx,cy,r-36,a);
      ticks += `<text x="${lp.x}" y="${lp.y+4}" text-anchor="middle" class="instrument-label" font-size="10">${p}</text>`;
    }
  }
  const tip = polar(cx, cy, r-32, needleAngle);
  const tail = polar(cx, cy, 16, needleAngle+180);
  const sideA = polar(cx, cy, 5, needleAngle+90);
  const sideB = polar(cx, cy, 5, needleAngle-90);

  let trend = "Steady", trendIcon = "minus";
  if (state.weather.hourly && state.weather.hourly.time) {
    const hrIdx = Math.max(0, state.weather.hourly.time.findIndex(t => new Date(t) > new Date()) - 1);
    // Approximate trend using surface pressure isn't in hourly; fall back to msl comparison via daily if available
  }

  return `
  <div class="glass rounded-2xl p-3 shadow-xl flex flex-col items-center">
    <div class="flex items-center gap-1.5 text-slate-400 mb-1 self-start"><i data-lucide="gauge" style="width:13px;height:13px"></i><span class="text-xs font-medium">Barometer</span></div>
    <svg viewBox="0 0 200 200" class="w-full max-w-[110px]">
      <circle cx="${cx}" cy="${cy}" r="${r}" class="instrument-face" />
      ${ticks}
      <polygon points="${tip.x},${tip.y} ${sideA.x},${sideA.y} ${tail.x},${tail.y} ${sideB.x},${sideB.y}"
        fill="#fbbf24" stroke="#fde68a" stroke-width="1" class="instrument-needle" />
      <circle cx="${cx}" cy="${cy}" r="6" fill="#0b1220" stroke="#fde68a" stroke-width="1.5" />
    </svg>
    <div class="text-center mt-0.5">
      <span class="text-lg font-bold font-mono">${Math.round(pressure)}</span>
      <span class="text-xs text-slate-400 ml-1">hPa</span>
      <p class="text-xs text-slate-400 font-mono">${pressure<980?'Stormy':pressure<1013?'Change':pressure<1030?'Fair':'Dry'}</p>
    </div>
  </div>`;
}

function thermometerGauge(current, daily) {
  const unit = state.unit;
  const minT = unit==='F' ? -20 : -30, maxT = unit==='F' ? 120 : 50;
  const temp = current.temperature_2m;
  const feels = current.apparent_temperature;
  const clamped = Math.min(maxT, Math.max(minT, temp));
  const frac = (clamped - minT) / (maxT - minT);

  const tubeX=100, tubeTop=20, tubeBottom=165, bulbCy=178, bulbR=18;
  const fillTop = tubeBottom - frac * (tubeBottom - tubeTop);
  const colorForFrac = f => f<0.25?'#60a5fa':f<0.5?'#34d399':f<0.75?'#fbbf24':'#f87171';
  const fillColor = colorForFrac(frac);

  let ticks = '';
  const step = unit==='F' ? 20 : 10;
  for (let t=minT; t<=maxT; t+=step) {
    const f = (t-minT)/(maxT-minT);
    const y = tubeBottom - f*(tubeBottom-tubeTop);
    ticks += `<line x1="112" y1="${y}" x2="122" y2="${y}" class="instrument-tick-major" />`;
    ticks += `<text x="128" y="${y+3}" class="instrument-label" font-size="9">${t}°</text>`;
  }

  return `
  <div class="glass rounded-2xl p-3 shadow-xl flex flex-col items-center">
    <div class="flex items-center gap-1.5 text-slate-400 mb-1 self-start"><i data-lucide="thermometer" style="width:13px;height:13px"></i><span class="text-xs font-medium">Thermometer</span></div>
    <svg viewBox="0 0 200 200" class="w-full max-w-[80px]">
      <rect x="92" y="${tubeTop}" width="16" height="${tubeBottom-tubeTop}" rx="8" class="instrument-face" />
      <circle cx="${tubeX}" cy="${bulbCy}" r="${bulbR}" class="instrument-face" />
      <rect x="94" y="${fillTop}" width="12" height="${tubeBottom-fillTop+bulbR}" rx="6" fill="${fillColor}" opacity="0.85" />
      <circle cx="${tubeX}" cy="${bulbCy}" r="${bulbR-3}" fill="${fillColor}" />
      ${ticks}
    </svg>
    <div class="text-center mt-0.5">
      <span class="text-lg font-bold font-mono">${Math.round(temp)}</span>
      <span class="text-xs text-slate-400 ml-1">°${unit}</span>
      <p class="text-xs text-slate-400 font-mono">Feels ${Math.round(feels)}°</p>
    </div>
  </div>`;
}

/* ============================== RENDER: SKY ARC + MOON ============================== */

function renderSkyArcPanel(compact) {
  const { daily } = state.weather;
  const now = new Date();
  const tIdx0 = todayDailyIdx(daily);
  const sunrise = daily.sunrise[tIdx0], sunset = daily.sunset[tIdx0];
  const { frac, isDay, phaseLabel } = sunArcProgress(now, sunrise, sunset);

  // Arc geometry: semicircle from left (rise) to right (set)
  const w = 320, h = compact ? 100 : 150, cx = w/2, cy = compact ? 82 : 130, r = compact ? 68 : 110;
  const rad = (180 - frac*180) * Math.PI/180;
  const bodyX = cx - r * Math.cos(rad);
  const bodyY = cy - r * Math.sin(rad);

  let arcPath = `M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`;
  let ticks = '';
  [0,0.25,0.5,0.75,1].forEach(f => {
    const a = (180 - f*180) * Math.PI/180;
    const tx = cx - r*Math.cos(a), ty = cy - r*Math.sin(a);
    ticks += `<circle cx="${tx}" cy="${ty}" r="2" fill="rgba(255,255,255,0.2)" />`;
  });

  const bodyColor = isDay ? '#fbbf24' : '#e2e8f0';
  const bodyGlow = isDay ? 'rgba(251,191,36,0.5)' : 'rgba(226,232,240,0.4)';

  const timeNow = now.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  const padCls = compact ? 'p-4' : 'p-6';
  const titleCls = compact ? 'text-base' : 'text-lg';
  const bodyR = compact ? 5 : 7, bodyGlowR = compact ? 9 : 12;

  return `
  <div class="glass rounded-3xl ${padCls} shadow-xl relative overflow-hidden">
    <div class="absolute -top-24 -left-24 w-64 h-64 ${isDay?'bg-amber-500/10':'bg-indigo-500/10'} blur-[80px] rounded-full pointer-events-none"></div>
    <div class="flex items-center justify-between mb-1 relative z-10">
      <div class="flex items-center gap-2 text-slate-200">
        <i data-lucide="${isDay?'sun':'moon-star'}" class="${isDay?'text-amber-400':'text-slate-300'}" style="width:${compact?16:20}px;height:${compact?16:20}px"></i>
        <h3 class="font-semibold ${titleCls}">Sky Position</h3>
      </div>
      <span class="text-xs font-mono px-2.5 py-1 rounded-full bg-white/10 text-slate-300">${phaseLabel} · ${timeNow}</span>
    </div>
    <div class="relative z-10">
      <svg viewBox="0 0 ${w} ${h}" class="w-full h-auto">
        <line x1="10" y1="${cy}" x2="${w-10}" y2="${cy}" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="3,4" />
        <path d="${arcPath}" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4,5" />
        ${ticks}
        <circle cx="${cx-r}" cy="${cy}" r="3" fill="rgba(255,255,255,0.3)" />
        <circle cx="${cx+r}" cy="${cy}" r="3" fill="rgba(255,255,255,0.3)" />
        <text x="${cx-r}" y="${cy+18}" text-anchor="middle" class="instrument-label" font-size="10">${fmtTime(sunrise)}</text>
        <text x="${cx+r}" y="${cy+18}" text-anchor="middle" class="instrument-label" font-size="10">${fmtTime(sunset)}</text>
        <circle cx="${bodyX}" cy="${bodyY}" r="${bodyGlowR}" fill="${bodyColor}" opacity="0.25" />
        <circle cx="${bodyX}" cy="${bodyY}" r="${bodyR}" fill="${bodyColor}" style="filter:drop-shadow(0 0 8px ${bodyGlow})" />
      </svg>
    </div>
    ${compact ? '' : `
    <div class="grid grid-cols-2 gap-3 mt-3 relative z-10">
      <div class="bg-white/5 rounded-2xl p-3 border border-white/5 flex items-center gap-3">
        <i data-lucide="sunrise" class="text-amber-400 shrink-0" style="width:22px;height:22px"></i>
        <div class="min-w-0">
          <p class="text-xs text-slate-400">Sunrise</p>
          <p class="font-semibold text-sm">${fmtTime(sunrise)}</p>
        </div>
      </div>
      <div class="bg-white/5 rounded-2xl p-3 border border-white/5 flex items-center gap-3">
        <i data-lucide="sunset" class="text-orange-500 shrink-0" style="width:22px;height:22px"></i>
        <div class="min-w-0">
          <p class="text-xs text-slate-400">Sunset</p>
          <p class="font-semibold text-sm">${fmtTime(sunset)}</p>
        </div>
      </div>
    </div>`}
  </div>`;
}

function renderMoonPanel(compact) {
  const now = new Date();
  const moon = moonPhase(now);
  const cx=60, cy=60, r=48;

        </g>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.15)" />
      </svg>
      <div class="min-w-0">
        <div class="flex items-center gap-1.5 text-slate-400 mb-0.5"><i data-lucide="moon" style="width:13px;height:13px"></i><span class="text-xs font-medium">Moon</span></div>

      </div>

  }

  return `
  <div class="glass rounded-3xl ${padCls} shadow-xl flex flex-col items-center text-center">
    <div class="flex items-center gap-2 mb-4 text-slate-200 self-start">

    </div>
    <svg viewBox="0 0 120 120" class="${svgCls}">
      <defs>
        <clipPath id="moonClip"><circle cx="${cx}" cy="${cy}" r="${r}" /></clipPath>
      </defs>
      <circle cx="${cx}" cy="${cy}" r="${r+6}" fill="rgba(226,232,240,0.05)" />
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="#1e293b" stroke="rgba(255,255,255,0.15)" />
      <g clip-path="url(#moonClip)">
        <rect x="${lit==='right' ? cx : cx-r}" y="${cy-r}" width="${r}" height="${r*2}" fill="#e2e8f0" />
        <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${r}" fill="${wax ? '#e2e8f0' : '#1e293b'}" />
      </g>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.15)" />
    </svg>

const SMART_LEVEL_STYLE = {
  warn: { bg:'bg-orange-500/10', text:'text-orange-300', border:'border-orange-500/20', dot:'bg-orange-400' },
  info: { bg:'bg-blue-500/10', text:'text-blue-300', border:'border-blue-500/20', dot:'bg-blue-400' },

/* ============================== LIFE INDICES ENGINE ============================== */

function idxLevel(score) {
  if (score >= 80) return { label:'Excellent', color:'text-green-400', bar:'#4ade80' };
  if (score >= 60) return { label:'Good', color:'text-lime-400', bar:'#a3e635' };
  if (score >= 40) return { label:'Fair', color:'text-yellow-400', bar:'#facc15' };
  if (score >= 20) return { label:'Poor', color:'text-orange-400', bar:'#fb923c' };
  return { label:'Very Poor', color:'text-red-400', bar:'#f87171' };
}
function clampScore(n) { return Math.max(0, Math.min(100, Math.round(n))); }

function computeLifeIndices() {
  if (!state.weather) return [];
  const { current, daily, hourly } = state.weather;
  const unit = state.unit;
  const tIdx = todayDailyIdx(daily);
  const hrIdx = Math.max(0, hourly.time.findIndex(t => new Date(t) > new Date()) - 1);
  const aqiCur = state.aqi ? state.aqi.current : null;
  const pollenHourly = state.aqi ? state.aqi.hourly : null;

  const feels = current.apparent_temperature;
  const feelsC = unit==='F' ? (feels-32)*5/9 : feels;
  const wind = current.wind_speed_10m || 0;
  const windMph = unit==='F' ? wind : wind/1.60934;
  const gust = current.wind_gusts_10m || 0;
  const humidity = current.relative_humidity_2m || 0;
  const precipToday = daily.precipitation_probability_max ? daily.precipitation_probability_max[tIdx] : 0;
  const rainSum = daily.precipitation_sum ? daily.precipitation_sum[tIdx] : 0;
  const uv = daily.uv_index_max ? daily.uv_index_max[tIdx] : 0;
  const cloud = current.cloud_cover ?? 50;
  const aqi = aqiCur ? aqiCur.us_aqi : null;
  const skyCode = current.weather_code;
  const isBadSky = [45,48,51,53,55,56,57,61,63,65,66,67,71,73,75,77,80,81,82,85,86,95,96,99].includes(skyCode);
  const isPrecipSky = [51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(skyCode);

  let pollenTotal = 0;
  if (pollenHourly) {
    const pIdx = Math.max(0, (pollenHourly.time||[]).findIndex(t => new Date(t) > new Date()) - 1);
    const keys = ['alder_pollen','birch_pollen','grass_pollen','mugwort_pollen','olive_pollen','ragweed_pollen'];
    pollenTotal = keys.reduce((sum,k) => sum + (pollenHourly[k] ? (pollenHourly[k][pIdx]||0) : 0), 0);
  }

  // Running/Walking: penalize extreme temps, high humidity, rain, poor air
  let running = 100;
  running -= Math.max(0, feelsC - 24) * 3.5;
  running -= Math.max(0, 5 - feelsC) * 3.5;
  running -= Math.max(0, humidity - 70) * 1.2;
  running -= precipToday * 0.6;
  running -= windMph > 20 ? (windMph-20)*1.5 : 0;
  running -= aqi != null ? Math.max(0, aqi-50)*0.4 : 0;
  running = clampScore(running);

  // Cycling: sensitive to wind/gusts and rain, less to heat
  let cycling = 100;
  cycling -= Math.max(0, feelsC - 28) * 3;
  cycling -= Math.max(0, 3 - feelsC) * 3;
  cycling -= precipToday * 0.7;
  cycling -= gust > 15 ? (gust-15)*2 : 0;
  cycling -= aqi != null ? Math.max(0, aqi-50)*0.4 : 0;
  cycling = clampScore(cycling);

  // Beach/Pool: wants warm, sunny, low wind, low precip
  let beach = 0;
  beach += Math.max(0, 30 - Math.abs(feelsC - 29)) * 3;
  beach += (100-cloud) * 0.3;
  beach -= precipToday * 0.8;
  beach -= windMph > 15 ? (windMph-15)*2 : 0;
  beach = clampScore(beach);

  // Gardening: mild temps, low-moderate wind, avoid heavy rain, some cloud ok
  let gardening = 100;
  gardening -= Math.max(0, feelsC - 27) * 2.5;
  gardening -= Math.max(0, 8 - feelsC) * 2.5;
  gardening -= rainSum > 0.3 ? (rainSum*20) : 0;
  gardening -= windMph > 20 ? (windMph-20)*1.5 : 0;
  gardening = clampScore(gardening);

  // Allergy: inverse of pollen + humidity/wind dispersal
  let allergyRisk = clampScore(Math.min(100, pollenTotal * 8));
  const allergyComfort = clampScore(100 - allergyRisk);

  // Car Wash: wants dry day today AND tomorrow (avoid wasting a wash)
  const rainTomorrow = daily.precipitation_probability_max ? (daily.precipitation_probability_max[tIdx+1]||0) : 0;
  let carWash = 100 - Math.max(precipToday, rainTomorrow*0.7);
  carWash -= windMph > 20 ? (windMph-20) : 0;
  carWash = clampScore(carWash);

  // Stargazing (tonight): low cloud cover, low precip chance, no moon glare handled elsewhere
  let stargazing = 100;
  stargazing -= cloud * 0.9;
  stargazing -= precipToday * 0.3;
  stargazing = clampScore(stargazing);

  return [
    { key:'running', icon:'footprints', label:'Running & Walking', score:running, reason: running>=70 ? 'Comfortable conditions for a run.' : (feelsC>28?'Warm — hydrate and go early/late.':(feelsC<5?'Cold — layer up.':(precipToday>50?'Rain likely — consider indoor options.':'Air quality or wind may slow you down.'))) },
    { key:'cycling', icon:'bike', label:'Cycling', score:cycling, reason: cycling>=70 ? 'Good riding conditions.' : (gust>15?`Gusty winds up to ${Math.round(gust)} ${unit==='F'?'mph':'km/h'}.`:(precipToday>50?'Wet roads likely.':'Less than ideal — check the wind.')) },
    { key:'beach', icon:'umbrella', label:'Beach & Pool', score:beach, reason: beach>=70 ? 'Great beach weather.' : (feelsC<20?'A bit cool for the water.':(cloud>60?'Cloud cover will limit the sun.':'Not the best day to soak up rays.')) },
    { key:'gardening', icon:'flower-2', label:'Gardening', score:gardening, reason: gardening>=70 ? 'Ideal for yard work.' : (rainSum>0.3?'Soggy soil expected.':(feelsC>27?'Heat will make it tiring — work early.':'Wind or temps may make it uncomfortable.')) },
    { key:'allergy', icon:'flower', label:'Allergy Comfort', score:allergyComfort, reason: allergyComfort>=70 ? 'Pollen levels are low.' : (allergyComfort>=40?'Moderate pollen — sensitive folks take note.':'High pollen — consider allergy meds.') },
    { key:'carwash', icon:'car', label:'Car Wash', score:carWash, reason: carWash>=70 ? 'Dry today and tomorrow — good timing.' : 'Rain today or tomorrow may undo the work.' },
    { key:'stargazing', icon:'stars', label:'Stargazing Tonight', score:stargazing, reason: stargazing>=70 ? 'Clear skies expected tonight.' : (cloud>60?`${cloud}% cloud cover will hide the stars.`:'Some cloud may interfere.') },
    { key:'uvrisk', icon:'sun', label:'Sun Safety', score: clampScore(100 - uv*8), reason: uv>=8?'Extreme UV — SPF 30+ and shade breaks.':(uv>=6?'High UV — sunscreen recommended.':'Low UV risk today.') },
  ];
}

/* ============================== RENDER: HISTORICAL TRENDS ============================== */

function renderHistoricalTrendsPanel() {
  const { daily } = state.weather;
  const unit = state.unit;
  const tIdx = todayDailyIdx(daily);
  const startIdx = Math.max(0, tIdx - 7);
  const pastDays = daily.time.slice(startIdx, tIdx).map((t,i) => {
    const di = startIdx + i;
    return {
      label: new Date(t).toLocaleDateString([], {weekday:'short'}),
      dateLabel: new Date(t).toLocaleDateString([], {month:'short', day:'numeric'}),
      max: Math.round(daily.temperature_2m_max[di]),
      min: Math.round(daily.temperature_2m_min[di]),
      precip: daily.precipitation_sum ? daily.precipitation_sum[di] : 0,
      code: daily.weather_code[di],
    };
  });
  if (!pastDays.length) return '';

  const allTemps = pastDays.flatMap(d => [d.max, d.min]);
  const tHi = Math.max(...allTemps), tLo = Math.min(...allTemps);
  const tRange = Math.max(1, tHi - tLo);
  const maxPrecip = Math.max(1, ...pastDays.map(d => d.precip));

  const chartH = 120;
  const w = 100 / pastDays.length;
  const points = pastDays.map((d,i) => {
    const x = w*i + w/2;
    const yMax = chartH - ((d.max - tLo) / tRange) * chartH;
    const yMin = chartH - ((d.min - tLo) / tRange) * chartH;
    return { x, yMax, yMin };
  });
  const maxPath = points.map((p,i) => `${i===0?'M':'L'} ${p.x} ${p.yMax}`).join(' ');
  const minPath = points.map((p,i) => `${i===0?'M':'L'} ${p.x} ${p.yMin}`).join(' ');

  const weekHigh = Math.max(...pastDays.map(d=>d.max));
  const weekLow = Math.min(...pastDays.map(d=>d.min));
  const weekPrecip = pastDays.reduce((s,d)=>s+d.precip,0);
  const avgHigh = Math.round(pastDays.reduce((s,d)=>s+d.max,0)/pastDays.length);

  return `
  <div class="glass rounded-3xl p-6 shadow-xl">
    <div class="flex items-center gap-2 mb-1 text-slate-200">
      <i data-lucide="history" class="text-blue-400" style="width:20px;height:20px"></i>
      <h3 class="font-semibold text-lg">Past 7 Days</h3>
    </div>
    <p class="text-xs text-slate-500 mb-5">How this week compares — temperature range and daily precipitation</p>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
      <div class="bg-white/5 border border-white/5 rounded-xl p-3">
        <p class="text-xs text-slate-400 mb-1">Week High</p>
        <p class="text-lg font-bold text-rose-300">${weekHigh}°${unit}</p>
      </div>
      <div class="bg-white/5 border border-white/5 rounded-xl p-3">
        <p class="text-xs text-slate-400 mb-1">Week Low</p>
        <p class="text-lg font-bold text-sky-300">${weekLow}°${unit}</p>
      </div>
      <div class="bg-white/5 border border-white/5 rounded-xl p-3">
        <p class="text-xs text-slate-400 mb-1">Avg High</p>
        <p class="text-lg font-bold text-slate-200">${avgHigh}°${unit}</p>
      </div>
      <div class="bg-white/5 border border-white/5 rounded-xl p-3">
        <p class="text-xs text-slate-400 mb-1">Total Precip</p>
        <p class="text-lg font-bold text-blue-300">${weekPrecip.toFixed(2)} in</p>
      </div>
    </div>

    <svg viewBox="0 0 100 ${chartH}" preserveAspectRatio="none" class="w-full" style="height:120px">
      <path d="${maxPath}" fill="none" stroke="#fb7185" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      <path d="${minPath}" fill="none" stroke="#38bdf8" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      ${points.map(p => `<circle cx="${p.x}" cy="${p.yMax}" r="1.4" fill="#fb7185"/><circle cx="${p.x}" cy="${p.yMin}" r="1.4" fill="#38bdf8"/>`).join('')}
    </svg>
    <div class="flex justify-between mt-1 mb-4">
      ${pastDays.map(d => `<span class="text-[10px] text-slate-500" style="width:${w}%; text-align:center">${d.label}</span>`).join('')}
    </div>

    <div class="flex items-end gap-1.5 h-14 mb-1">
      ${pastDays.map(d => {
        const h = Math.max(2, (d.precip / maxPrecip) * 100);
        return `<div class="flex-1 flex flex-col items-center justify-end h-full" title="${d.precip.toFixed(2)} in">
          <div class="w-full rounded-t bg-blue-400/60" style="height:${h}%"></div>
        </div>`;
      }).join('')}
    </div>
    <div class="flex justify-between mb-4">
      ${pastDays.map(d => `<span class="text-[10px] text-slate-500 flex-1 text-center">${d.precip>0 ? d.precip.toFixed(2)+'"' : '—'}</span>`).join('')}
    </div>

    <div class="flex items-center gap-4 text-xs text-slate-400">
      <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 rounded-full bg-rose-400"></span>High</span>
      <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 rounded-full bg-sky-400"></span>Low</span>
      <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-blue-400/60"></span>Precip</span>
    </div>
  </div>`;
}

/* ============================== RENDER: DASHBOARD ============================== */

function renderDashboard() {
  const { current, daily, hourly } = state.weather;
  const unit = state.unit;
  const tIdx = todayDailyIdx(daily);
  const maxTemp = Math.round(daily.temperature_2m_max[tIdx]);
  const minTemp = Math.round(daily.temperature_2m_min[tIdx]);
  const [icon, iconColor] = ICON_MAP(current.weather_code, current.is_day);

  const currentHourIdx = Math.max(0, hourly.time.findIndex(t => new Date(t) > new Date()) - 1);
  const next24 = hourly.time.slice(currentHourIdx, currentHourIdx+25).map((t,i) => {
    const idx = currentHourIdx+i;
    const hr = new Date(t).getHours();
    return { time: new Date(t).toLocaleTimeString([], {hour:'numeric'}), temp: Math.round(hourly.temperature_2m[idx]), code: hourly.weather_code[idx], precip: hourly.precipitation_probability[idx], isDay: hr>=6 && hr<=19, idx };
  });

  const days = daily.time.slice(tIdx+1, tIdx+8)
    .map((t,i) => {
      const di = tIdx+i+1;
      if (daily.temperature_2m_max[di] == null || daily.temperature_2m_min[di] == null) return null;
      return {
        day: new Date(t).toLocaleDateString([], {weekday:'short'}),
        max: Math.round(daily.temperature_2m_max[di]), min: Math.round(daily.temperature_2m_min[di]),
        code: daily.weather_code[di], precip: daily.precipitation_probability_max[di] ?? 0, dayIdx: di
      };
    })
    .filter(Boolean);

      </div>
      <div class="flex-1">
        <h3 class="${style.text} font-semibold text-lg">${escapeHtml(worst.event)} — ${state.alerts.length} active alert${state.alerts.length>1?'s':''}</h3>
        <p class="text-slate-300 mt-1 text-sm line-clamp-2">${escapeHtml(worst.headline || worst.description || '')}</p>
      </div>

        <div class="lg:col-span-2">${renderSkyArcPanel(true)}</div>

      <div class="glass rounded-3xl p-6 shadow-xl">
        <div class="flex items-center gap-2 mb-6 text-slate-200"><i data-lucide="clock" class="text-blue-400" style="width:20px;height:20px"></i><h3 class="font-semibold text-lg">Today's Forecast</h3><span class="text-xs text-slate-500 font-normal ml-1">· tap an hour for details</span></div>
        <div class="flex overflow-x-auto gap-4 pb-4 -mx-2 px-2 no-scrollbar">
          ${next24.map((h,idx) => {
            const [ic, ic_color] = ICON_MAP(h.code, h.isDay ? 1 : 0);
            const active = state.expandedHour === h.idx;
            return `
            <button onclick="toggleHour(${h.idx})" class="flex flex-col items-center min-w-[80px] p-4 rounded-2xl transition-colors text-left ${active ? 'bg-blue-500/30 border border-blue-400/50' : (idx===0 ? 'bg-blue-500/20 border border-blue-500/30' : 'bg-white/5 border border-white/5 hover:bg-white/10')}">

              <i data-lucide="${ic}" class="${ic_color} mb-3" style="width:26px;height:26px"></i>

              <div class="flex items-center gap-1 text-xs text-blue-300 font-medium"><i data-lucide="droplets" style="width:10px;height:10px"></i>${h.precip}%</div>

    </section>


    <!-- SECTION: Detailed Metrics -->
    <section>
      <div class="flex items-center gap-2 mb-4 text-slate-200"><i data-lucide="layout-grid" class="text-blue-400" style="width:20px;height:20px"></i><h3 class="font-semibold text-lg">Detailed Metrics</h3></div>
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
        ${buildMetrics()}
      </div>
    </section>

    <!-- SECTION: Life Indices -->
    <section>
      ${renderLifeIndicesPanel()}

    <!-- SECTION: Radar & Storm Map -->
    <section>
      <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
        <div class="flex items-center gap-2 text-slate-200"><i data-lucide="map" class="text-blue-400" style="width:20px;height:20px"></i><h3 class="font-semibold text-lg">Radar & Storm Map</h3></div>
        <p class="text-xs text-slate-500 flex items-center gap-1.5"><i data-lucide="mouse-pointer-click" style="width:12px;height:12px"></i>Tap anywhere on the map for area details</p>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="glass p-5 rounded-3xl shadow-xl flex flex-col h-[520px] lg:col-span-2">
          <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
            <div class="flex items-center gap-2 text-slate-200"><i data-lucide="activity" class="text-blue-400" style="width:20px;height:20px"></i><h3 class="font-semibold text-lg">Live Radar</h3></div>
            <button onclick="fetchNationalStormAlerts()" class="flex items-center gap-1.5 text-xs font-mono px-2.5 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 transition-colors">
              <i data-lucide="refresh-cw" class="${state.nationalAlertsLoading?'animate-spin':''}" style="width:12px;height:12px"></i> Refresh Alerts
            </button>
          </div>
          <div id="radar-map" class="w-full flex-1 rounded-2xl overflow-hidden border border-white/5 z-0"></div>
          <div id="area-detail-panel" class="mt-3 text-xs font-mono text-slate-400 min-h-[18px]">Precipitation radar + active NWS severe warnings (tornado, hurricane, flash flood) shown together. Click the map to inspect an area.</div>
        </div>
        ${renderStormTrackerPanel()}
      </div>
    </section>

    <!-- SECTION: Alerts & Safety -->
    <section>
      ${renderSmartAlertsPanel()}
    </section>

    <!-- SECTION: Historical Trends -->
    <section>
      ${renderHistoricalTrendsPanel()}
    </section>

    <!-- SECTION: NWS Forecast Discussion -->
    <section>
      ${forecastNarrative}
    </section>
  </main>`;
}

/* ============================== MASTER RENDER ============================== */

function render() {
  const app = document.getElementById('app');

  if (state.loading && !state.weather) {
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center text-white">
        <div class="flex flex-col items-center gap-4">
          <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-slate-400 font-medium tracking-wide">Gathering data from multiple weather services...</p>
        </div>
      </div>`;
    return;
  }

  let body = renderNav();
  if (state.view === 'warnings') {
    body += renderWarningsView();
  } else {
    body += renderDashboard();
  }
  app.innerHTML = body;

  if (window.lucide) lucide.createIcons();

  if (state.view === 'dashboard') {
    initCombinedRadarMap();
    renderAlertPolygons();
  }
}

/* ============================== COMBINED RADAR + STORM MAP ============================== */

function initCombinedRadarMap() {
  const el = document.getElementById('radar-map');
  if (!el || !window.L) return;
  const { lat, lon } = state.location;

  // Reuse an existing map instance across re-renders so layer toggles / zoom persist.
  if (leafletMap && leafletMap._container !== el) { leafletMap.remove(); leafletMap = null; }
  if (leafletMap) { alertLayerGroup && alertLayerGroup.clearLayers(); renderAlertPolygons(); return; }

  leafletMap = L.map(el, { zoomControl:false }).setView([lat, lon], 7);
  L.control.zoom({ position:'bottomright' }).addTo(leafletMap);

  const base = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd', maxZoom:20
  }).addTo(leafletMap);

  precipLayerGroup = L.layerGroup().addTo(leafletMap);
  fetch('https://api.rainviewer.com/public/weather-maps.json')
    .then(r => r.json())
    .then(data => {
      const past = data.radar && data.radar.past;
      if (past && past.length) {
        const latest = past[past.length-1].path;
        L.tileLayer(`https://tilecache.rainviewer.com${latest}/256/{z}/{x}/{y}/2/1_1.png`, { opacity:0.65, zIndex:10 }).addTo(precipLayerGroup);
      }
    }).catch(()=>{});

  alertLayerGroup = L.layerGroup().addTo(leafletMap);
  renderAlertPolygons();

  const markerHtml = `<div style="background-color:#3b82f6;width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 0 10px rgba(59,130,246,0.8);"></div>`;
  const icon = L.divIcon({ className:'custom-div-icon', html: markerHtml, iconSize:[16,16], iconAnchor:[8,8] });
  L.marker([lat, lon], { icon }).addTo(leafletMap).bindPopup(`<b>${escapeHtml(state.location.name)}</b><br>Your location`);

  L.control.layers(null, {
    'Precipitation Radar': precipLayerGroup,
    'Severe Storm Warnings': alertLayerGroup,
  }, { position:'topright', collapsed:true }).addTo(leafletMap);

  leafletMap.on('click', onRadarMapClick);
}

function renderAlertPolygons() {
  if (!alertLayerGroup) return;
  alertLayerGroup.clearLayers();
  (state.nationalAlerts || []).forEach(a => {
    const style = stormStyle(a.event);
    try {
      if (a.geometry) {
        const layer = L.geoJSON(a.geometry, {
          style: { color: style.color, weight:2, fillColor: style.color, fillOpacity:0.22 }
        }).addTo(alertLayerGroup);
        layer.bindPopup(`<b>${escapeHtml(a.event)}</b><br>${escapeHtml(a.areaDesc||'')}`);
      }
    } catch (e) { /* skip malformed geometry */ }
  });
}

/* ============================== AREA DETECTION ============================== */

// Ray-casting point-in-polygon test. point: [lon, lat]. ring: array of [lon, lat].
function pointInRing(point, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    const intersects = ((yi > point[1]) !== (yj > point[1])) &&
      (point[0] < (xj - xi) * (point[1] - yi) / ((yj - yi) || 1e-12) + xi);
    if (intersects) inside = !inside;
  }
  return inside;
}

function pointInGeometry(point, geometry) {
  if (!geometry) return false;
  if (geometry.type === 'Polygon') {
    const coords = geometry.coordinates;
    if (!coords.length || !pointInRing(point, coords[0])) return false;
    for (let i = 1; i < coords.length; i++) { if (pointInRing(point, coords[i])) return false; }
    return true;
  }
  if (geometry.type === 'MultiPolygon') {
    return geometry.coordinates.some(poly => pointInGeometry(point, { type:'Polygon', coordinates: poly }));
  }
  return false;
}

function findAlertsAtPoint(lat, lon) {
  return (state.nationalAlerts || []).filter(a => pointInGeometry([lon, lat], a.geometry));
}

function onRadarMapClick(e) {
  const { lat, lng } = e.latlng;
  const panel = document.getElementById('area-detail-panel');
  const popup = L.popup({ maxWidth: 260 })
    .setLatLng(e.latlng)
    .setContent('<div class="text-xs font-mono text-slate-300">Loading area details…</div>')
    .openOn(leafletMap);
  if (panel) panel.innerHTML = `<span class="text-slate-500">Looking up ${lat.toFixed(2)}, ${lng.toFixed(2)}…</span>`;

  const tempUnit = state.unit === 'F' ? 'fahrenheit' : 'celsius';
  const windUnit = state.unit === 'F' ? 'mph' : 'kmh';

  Promise.all([
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weather_code,wind_speed_10m&temperature_unit=${tempUnit}&wind_speed_unit=${windUnit}&timezone=auto`).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`, { headers: { 'Accept':'application/json' } }).then(r => r.ok ? r.json() : null).catch(() => null),
  ]).then(([wx, geo]) => {
    const hits = findAlertsAtPoint(lat, lng);
    const addr = geo && geo.address ? geo.address : null;
    const placeName = addr ? [addr.city || addr.town || addr.village || addr.county, addr.state || addr.country].filter(Boolean).join(', ') : `${lat.toFixed(2)}, ${lng.toFixed(2)}`;
    const cur = wx && wx.current;
    const condition = cur ? (WEATHER_DESC[cur.weather_code] || 'Unknown') : null;
    const tempStr = cur ? `${Math.round(cur.temperature_2m)}°${state.unit}` : null;

    const alertsHtml = hits.length
      ? hits.map(a => {
          const s = stormStyle(a.event);
          return `<div class="mt-1 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full shrink-0" style="background:${s.color}"></span><span class="font-semibold" style="color:${s.color}">${escapeHtml(a.event)}</span></div>`;
        }).join('')
      : `<div class="mt-1.5 flex items-center gap-1.5 text-emerald-300"><i data-lucide="shield-check" style="width:12px;height:12px"></i>No active severe warnings here</div>`;

    const content = `
      <div class="text-xs font-mono min-w-[190px]">
        <div class="font-semibold text-white mb-1 truncate">${escapeHtml(placeName)}</div>
        ${cur ? `<div class="text-slate-300">${escapeHtml(condition)} · ${tempStr} · ${Math.round(cur.wind_speed_10m)} ${windUnit==='mph'?'mph':'km/h'} wind</div>` : `<div class="text-slate-500">Conditions unavailable</div>`}
        ${alertsHtml}
      </div>`;

    popup.setContent(content);
    if (panel) {
      panel.innerHTML = hits.length
        ? `<span class="font-semibold" style="color:${stormStyle(hits[0].event).color}">${escapeHtml(placeName)}: ${hits.map(h=>escapeHtml(h.event)).join(', ')}</span>`
        : `<span class="text-slate-400">${escapeHtml(placeName)}${cur ? ` — ${escapeHtml(condition)}, ${tempStr}` : ''} · No active severe warnings</span>`;
    }
    if (window.lucide) lucide.createIcons();
  }).catch(() => {
    popup.setContent('<div class="text-xs font-mono text-red-400">Couldn\'t load area details.</div>');
  });
}

function focusOnAlert(id) {
  const a = (state.nationalAlerts || []).find(x => String(x.id) === String(id));
  if (!a || !a.geometry || !leafletMap) return;
  try {
    const layer = L.geoJSON(a.geometry);
    leafletMap.fitBounds(layer.getBounds(), { maxZoom: 8, padding: [20,20] });
  } catch (e) { /* ignore */ }
}

/* ============================== INIT ============================== */

fetchAllData();
fetchNationalStormAlerts();
</script>
